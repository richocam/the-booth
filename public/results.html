<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE BOOTH — Live Results</title>
<style>
:root{--bg:#0d151c;--panel:#17232d;--text:#fff;--muted:#9eadb8;--teal:#18b8b1;--red:#e43b2f}*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1180px;margin:auto;padding:34px}.header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}
h1{font-size:42px;margin:0}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px}
.card{background:var(--panel);border-radius:18px;padding:22px}.card h2{font-size:23px;margin:0 0 6px}.total{color:var(--muted);font-size:13px;margin-bottom:18px}
.row{margin:15px 0}.label{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-weight:700}.track{height:25px;background:#283640;border-radius:8px;overflow:hidden}
.bar{height:100%;background:var(--teal);transition:width .45s ease}.pct{font-variant-numeric:tabular-nums}.footer{color:var(--muted);font-size:12px;margin-top:20px}
.badge{background:var(--red);color:#fff;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800}
@media(max-width:600px){.wrap{padding:20px}.grid{grid-template-columns:1fr}.header{display:block}.badge{display:inline-block;margin-top:12px}}
</style></head>
<body><div class="wrap"><div class="header"><div><h1>THE BOOTH — LIVE</h1><div class="sub">Instant audience poll results</div></div><div class="badge" id="responses">0 RESPONSES</div></div><div class="grid" id="results"></div><div class="footer" id="updated"></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function refresh(){try{const data=await (await fetch('/api/poll-results',{cache:'no-store'})).json();
document.querySelector('#responses').textContent=`${data.responseCount} RESPONSE${data.responseCount===1?'':'S'}`;
document.querySelector('#updated').textContent=`Updated ${new Date(data.updatedAt).toLocaleTimeString()}`;
document.querySelector('#results').innerHTML=data.results.map(q=>`<section class="card"><h2>${esc(q.text)}</h2><div class="total">${q.total} answer${q.total===1?'':'s'} to this question</div>${q.options.map(o=>`<div class="row"><div class="label"><span>${esc(o.option)}</span><span class="pct">${o.percent.toFixed(1)}% &nbsp; (${o.count})</span></div><div class="track"><div class="bar" style="width:${Math.max(0,Math.min(100,o.percent))}%"></div></div></div>`).join('')}</section>`).join('')||'<p>No live poll questions are configured.</p>';
}catch(e){document.querySelector('#updated').textContent='Waiting for live results…'}}
refresh();setInterval(refresh,3000);
</script></body></html>
