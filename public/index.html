<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE BOOTH — Register</title>
<style>
:root{--bg:#101820;--panel:#19242d;--text:#fff;--muted:#aab4bc;--teal:#18b8b1}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);margin:0}
.wrap{max-width:680px;margin:auto;padding:28px 22px 48px}h1{font-size:48px;margin:18px 0 3px}.tag{color:var(--muted);margin-bottom:24px}
.card{background:var(--panel);padding:20px;border-radius:16px;margin-top:18px}label{display:block;margin:14px 0 6px;font-weight:600}
input,select{width:100%;padding:14px;border-radius:10px;border:1px solid #4d5962;background:#111a21;color:#fff;font-size:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}.check input{width:auto;margin-top:4px}
button{width:100%;margin-top:22px;padding:17px;border:0;border-radius:12px;background:#fff;color:#111;font-size:20px;font-weight:800;cursor:pointer}
button.secondary{background:var(--teal);color:#071312}.pass{text-align:center}.pass img{max-width:280px;width:82%;background:#fff;padding:12px;border-radius:12px}
.small{font-size:13px;color:var(--muted)}.pollQ{padding:14px 0;border-top:1px solid #33414c}.pollQ:first-child{border-top:0}
.pollQ h3{font-size:18px;margin:0 0 10px}.choice{display:flex;gap:10px;align-items:center;padding:8px 0;font-weight:400}.choice input{width:auto}
.success{background:#123d39;border:1px solid #1b847b;padding:14px;border-radius:10px;margin-top:15px}
</style>
</head>
<body>
<div class="wrap">
  <h1>THE BOOTH</h1><div class="tag">Have your say.</div>
  <form id="f" class="card">
    <label>Name</label><input name="name" required>
    <label>Mobile</label><input name="mobile" placeholder="04…">
    <label>Email (optional)</label><input name="email" type="email">
    <label>Age</label><select name="ageBracket"><option>18–24</option><option>25–34</option><option>35–44</option><option>45–54</option><option>55–64</option><option>65+</option></select>
    <label>Postcode</label><input name="postcode" inputmode="numeric">
    <label>Gender (optional)</label><select name="gender"><option value="">Prefer not to say</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Self-described</option></select>
    <label class="check"><input type="checkbox" name="consent" required><span>I consent to being filmed and to my recorded responses being used for editorial, broadcast, digital and social-media purposes under the campaign terms.</span></label>
    <label class="check"><input type="checkbox" name="contactOK"><span>I may be contacted for a longer interview.</span></label>
    <button>CONTINUE TO QUICK POLL</button>
  </form>
  <div id="out"></div>
</div>
<script>
const f=document.querySelector('#f'),out=document.querySelector('#out');
let participantId='',sessionToken='';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function showPass(qrURL, token){
  const imageURL = qrURL || `/api/pass-qr/${encodeURIComponent(token)}?v=${Date.now()}`;
  out.innerHTML=`<div class="card pass">
    <h2>Your THE BOOTH pass</h2>
    <p>Quick poll complete. Show this QR code to the booth camera.</p>
    <img id="passQR" alt="THE BOOTH QR pass" src="${imageURL}">
    <div id="qrStatus" class="small">Loading your Booth pass…</div>
    <p class="small">Keep this screen open until your Booth recording starts.</p>
  </div>`;

  const img=document.querySelector('#passQR');
  const status=document.querySelector('#qrStatus');
  img.onload=()=>{ status.textContent='Your Booth pass is ready.'; };
  img.onerror=()=>{
    status.innerHTML='The pass image did not load. <button type="button" id="retryQR" style="width:auto;margin:8px 0 0;padding:9px 12px;font-size:14px">RETRY QR</button>';
    document.querySelector('#retryQR').onclick=()=>{
      status.textContent='Reloading your Booth pass…';
      img.src=`/api/pass-qr/${encodeURIComponent(token)}?v=${Date.now()}`;
    };
  };
  window.scrollTo({top:0,behavior:'smooth'});
}

async function buildRequiredPoll(){
  const qs=await (await fetch('/api/poll-questions',{cache:'no-store'})).json();
  if(!qs.length)return '';
  return `<div class="card" id="pollCard">
    <h2>Quick poll</h2>
    <p><b>One quick step before your Booth recording.</b></p>
    <p class="small">Please answer each question below. Your Booth QR pass will appear after you submit the poll.</p>
    <form id="pollForm">
      ${qs.map(q=>`<div class="pollQ"><h3>${esc(q.text)}</h3>${q.options.map(o=>`<label class="choice"><input required type="radio" name="${esc(q.id)}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`).join('')}
      <button class="secondary" type="submit">SUBMIT POLL &amp; GET MY BOOTH PASS</button>
    </form>
    <div id="pollStatus"></div>
  </div>`;
}

f.onsubmit=async e=>{
  e.preventDefault();
  const submit=f.querySelector('button');
  submit.disabled=true;submit.textContent='PLEASE WAIT…';
  try{
    const d=Object.fromEntries(new FormData(f));d.consent=!!d.consent;d.contactOK=!!d.contactOK;
    const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
    const j=await r.json();if(!r.ok){alert(j.error);return}
    participantId=j.participantId;sessionToken=j.sessionToken;
    f.style.display='none';

    if(!j.pollRequired){
      showPass(j.qrURL, sessionToken);
      return;
    }

    out.innerHTML=await buildRequiredPoll();
    const pf=document.querySelector('#pollForm');
    if(!pf){
      out.innerHTML='<div class="card"><p>Could not load the quick poll. Please ask a staff member for assistance.</p></div>';
      return;
    }

    pf.onsubmit=async ev=>{
      ev.preventDefault();
      const pollButton=pf.querySelector('button');
      pollButton.disabled=true;pollButton.textContent='SAVING…';
      const raw=Object.fromEntries(new FormData(pf));
      const rr=await fetch('/api/poll-response',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({participantId,sessionToken,answers:raw})});
      const jj=await rr.json();
      if(!rr.ok){
        document.querySelector('#pollStatus').innerHTML=`<p>${esc(jj.error||'Could not save poll.')}</p>`;
        pollButton.disabled=false;pollButton.textContent='SUBMIT POLL & GET MY BOOTH PASS';
        return;
      }
      showPass(jj.qrURL, sessionToken);
    };
  }catch(err){
    alert('Could not connect to THE BOOTH server. Please try again.');
  }finally{
    submit.disabled=false;submit.textContent='CONTINUE TO QUICK POLL';
  }
};
</script>
</body>
</html>
