<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE BOOTH — Register</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#fff;margin:0}.wrap{max-width:620px;margin:auto;padding:28px}h1{font-size:48px;margin:20px 0 4px}.tag{color:#bbb;margin-bottom:24px}label{display:block;margin:14px 0 6px}input,select{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;font-size:16px}.check{display:flex;gap:10px;align-items:flex-start}.check input{width:auto;margin-top:4px}button{width:100%;margin-top:22px;padding:17px;border:0;border-radius:12px;background:white;color:#111;font-size:20px;font-weight:700}.pass{text-align:center}.pass img{max-width:300px;background:#fff;padding:12px;border-radius:12px}.small{font-size:13px;color:#aaa}</style></head><body><div class="wrap"><h1>THE BOOTH</h1><div class="tag">Have your say.</div><form id="f"><label>Name</label><input name="name" required><label>Mobile</label><input name="mobile" placeholder="04…"><label>Email (optional)</label><input name="email" type="email"><label>Age</label><select name="ageBracket"><option>18–24</option><option>25–34</option><option>35–44</option><option>45–54</option><option>55–64</option><option>65+</option></select><label>Postcode</label><input name="postcode" inputmode="numeric"><label>Gender (optional)</label><select name="gender"><option value="">Prefer not to say</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Self-described</option></select><label class="check"><input type="checkbox" name="consent" required><span>I consent to being filmed and to my recorded responses being used for editorial, broadcast, digital and social-media purposes under the campaign terms.</span></label><label class="check"><input type="checkbox" name="contactOK"><span>I may be contacted for a longer interview.</span></label><button>GET MY PASS</button></form><div id="out"></div></div><script>
const f=document.querySelector('#f'),out=document.querySelector('#out');f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));d.consent=!!d.consent;d.contactOK=!!d.contactOK;const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(!r.ok){alert(j.error);return}out.innerHTML=`<div class="pass"><h2>Your VoxPop Pass</h2><p>Show this QR code to the booth camera.</p><img src="${j.qrDataURL}"><p class="small">Prototype mode: registration is automatically verified.</p></div>`;f.style.display='none'};
</script></body></html>
